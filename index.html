<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Mangas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <img src="imagenes/banner_mansion.png" alt="Descripción de la imagen" width="500" height="300", style="display: block; margin-left: auto; margin-right: auto;">
        <h1>📚 La Mansión del Manga</h1>
        <div class="filters">
            <!-- Barra de búsqueda existente -->
            <input type="text" id="searchInput" placeholder="Buscar por título, guionista...">
            
            <!-- Nuevo filtro por editorial -->
            <select id="editorialFilter">
                <option value="">Todas las editoriales</option>
                <!-- Las opciones se cargarán con JavaScript -->
            </select>
        </div>
        

        <!-- Tabla de datos -->
        <table id="mangaTable">
            <thead>
                <tr>
                    <th>Portada</th>                
                    <th onclick="sortTable(0)">Título ▲▼</th>
                    <th onclick="sortTable(1)">Guionista ▲▼</th>
                    <th onclick="sortTable(2)">Dibujante ▲▼</th>
                    <th onclick="sortTable(3)">Tomos ▲▼</th>
                    <th onclick="sortTable(4)">Editorial ▲▼</th>
                    <th>Enlace</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Los datos se cargarán aquí con JavaScript -->
            </tbody>
        </table>
    </div>


    <script src="script.js"></script>
</body>
</html>
