<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Mangas</title>
    <link rel="stylesheet" href="style.css">
    <style>
    /* Mejorar la experiencia táctil en dispositivos móviles */
    @media (max-width: 768px) {
        .manga-card {
            -webkit-tap-highlight-color: transparent;
        }
        
        .manga-button, .manga-link, .pagination-button {
            min-height: 44px;
            min-width: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    }
    
    /* Prevenir zoom no deseado en inputs */
    @media screen and (max-width: 768px) {
        input, select, textarea {
            font-size: 16px; /* Previene zoom en iOS */
        }
    }
</style>
</head>
<body>
    <header>
        <h1>Catálogo de Mangas</h1>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Buscar por título, guionista o dibujante...">
            <button id="searchButton">Buscar</button>
        </div>
        <div class="filters">
            <div class="filter-group">
                <label for="demographyFilter">Demografia:</label>
                <select id="demographyFilter">
                    <option value="">Todas</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="statusFilter">Estado:</label>
                <select id="statusFilter">
                    <option value="">Todos</option>
                    <option value="completa">Completos</option>
                    <option value="abierta">Subiendo</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="editorialFilter">Editorial:</label>
                <select id="editorialFilter">
                    <option value="">Todas</option>
                </select>
            </div>
        </div>
    </header>

    <main>
        <div class="manga-grid" id="mangaGrid">
            <!-- Los mangas se cargarán aquí con JavaScript -->
        </div>
        
        <div class="pagination" id="pagination">
            <!-- Los controles de paginación se generarán aquí -->
        </div>
    </main>

    <!-- Modal para mostrar las portadas -->
    <div class="modal" id="coversModal">
        <div class="modal-content">
            <span class="close-button" id="closeCoversModal">&times;</span>
            <h2 id="coversModalTitle"></h2>
            <div class="covers-gallery" id="coversGallery"></div>
        </div>
    </div>

    <!-- Modal para mostrar la descripción -->
    <div class="modal" id="descriptionModal">
        <div class="modal-content">
            <span class="close-button" id="closeDescriptionModal">&times;</span>
            <h2 id="descriptionModalTitle"></h2>
            <div class="manga-details" id="descriptionModalDetails"></div>
            <p class="manga-description" id="descriptionModalText"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
